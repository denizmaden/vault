name: vault

services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:29092 1 30"]
      interval: 10s
      timeout: 30s
      retries: 20
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /bin/sh -c "
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic vault.ledger.events --partitions 1 --replication-factor 1
      "

  identity-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_password123"
    ports:
      - "14333:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Your_strong_password123 -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - identity-data:/var/opt/mssql

  identity-api:
    build:
      context: .
      dockerfile: src/services/identity/Vault.Services.Identity.Api/Dockerfile
    depends_on:
      identity-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__IdentityDatabase: "Server=identity-db,1433;Database=VaultIdentity;User Id=sa;Password=Your_strong_password123;TrustServerCertificate=True"
      IdentityServer__SwaggerClientId: "vault-swagger"
      IdentityServer__SwaggerClientSecret: "vault-swagger-secret"
      IdentityServer__IssuerUri: "http://localhost:8080"
    ports:
      - "8080:8080"

  customer-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_password123"
    ports:
      - "14334:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Your_strong_password123 -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - customer-data:/var/opt/mssql

  customer-api:
    build:
      context: .
      dockerfile: src/services/customer/Vault.Services.Customer.Api/Dockerfile
    depends_on:
      customer-db:
        condition: service_healthy
      identity-api:
        condition: service_started
      otel-collector:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__CustomerDatabase: "Server=customer-db,1433;Database=VaultCustomer;User Id=sa;Password=Your_strong_password123;TrustServerCertificate=True"
      Authentication__Authority: "http://localhost:8080"
      Authentication__MetadataAddress: "http://identity-api:8080/.well-known/openid-configuration"
      Authentication__RequireHttpsMetadata: "false"
      Observability__Logging__Provider: "Serilog"
      Observability__Tracing__Enabled: "true"
      Observability__Metrics__Enabled: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      VAULT_OTEL_TRACE_SAMPLING_RATIO: "1.0"
    ports:
      - "8081:8080"

  ledger-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_password123"
    ports:
      - "14335:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Your_strong_password123 -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ledger-data:/var/opt/mssql

  ledger-api:
    build:
      context: .
      dockerfile: src/services/ledger/Vault.Services.Ledger.Api/Dockerfile
    depends_on:
      ledger-db:
        condition: service_healthy
      identity-api:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__LedgerDatabase: "Server=ledger-db,1433;Database=VaultLedger;User Id=sa;Password=Your_strong_password123;TrustServerCertificate=True"
      Authentication__Authority: "http://localhost:8080"
      Authentication__MetadataAddress: "http://identity-api:8080/.well-known/openid-configuration"
      Authentication__RequireHttpsMetadata: "false"
      Messaging__Provider: "Kafka"
      Messaging__Kafka__BootstrapServers: "kafka:9092"
      LedgerMessaging__EventsDestination: "vault.ledger.events"
      Observability__Logging__Provider: "Serilog"
      Observability__Tracing__Enabled: "true"
      Observability__Metrics__Enabled: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      VAULT_OTEL_TRACE_SAMPLING_RATIO: "1.0"
    ports:
      - "8082:8080"

  wallet-db:
    image: mongo:8.0
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - wallet-data:/data/db

  wallet-cache:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - wallet-cache-data:/data

  wallet-api:
    build:
      context: .
      dockerfile: src/services/wallet/Vault.Services.Wallet.Api/Dockerfile
    depends_on:
      wallet-db:
        condition: service_healthy
      wallet-cache:
        condition: service_healthy
      identity-api:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      Authentication__Authority: "http://localhost:8080"
      Authentication__MetadataAddress: "http://identity-api:8080/.well-known/openid-configuration"
      Authentication__RequireHttpsMetadata: "false"
      Mongo__ConnectionString: "mongodb://wallet-db:27017"
      Mongo__DatabaseName: "vault-wallet"
      Mongo__WalletsCollectionName: "wallets"
      Messaging__Provider: "Kafka"
      Messaging__Kafka__BootstrapServers: "kafka:9092"
      WalletMessaging__LedgerEventsDestination: "vault.ledger.events"
      WalletMessaging__ConsumerGroupId: "vault-wallet-projection"
      Caching__Enabled: "true"
      Caching__Provider: "Redis"
      Caching__Redis__ConnectionString: "wallet-cache:6379"
      Caching__Redis__InstanceName: "vault-wallet:"
      WalletCache__WalletDetailsTtlSeconds: "300"
      Observability__Logging__Provider: "Serilog"
      Observability__Tracing__Enabled: "true"
      Observability__Metrics__Enabled: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      VAULT_OTEL_TRACE_SAMPLING_RATIO: "1.0"
    ports:
      - "8083:8080"

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  transaction-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_password123"
    ports:
      - "14336:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Your_strong_password123 -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - transaction-data:/var/opt/mssql

  transaction-api:
    build:
      context: .
      dockerfile: src/services/transaction/Vault.Services.Transaction.Api/Dockerfile
    depends_on:
      transaction-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity-api:
        condition: service_started
      otel-collector:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__TransactionDatabase: "Server=transaction-db,1433;Database=VaultTransaction;User Id=sa;Password=Your_strong_password123;TrustServerCertificate=True"
      Authentication__Authority: "http://localhost:8080"
      Authentication__MetadataAddress: "http://identity-api:8080/.well-known/openid-configuration"
      Authentication__RequireHttpsMetadata: "false"
      Messaging__Provider: "RabbitMQ"
      Messaging__RabbitMq__HostName: "rabbitmq"
      Messaging__RabbitMq__Port: "5672"
      Messaging__RabbitMq__UserName: "guest"
      Messaging__RabbitMq__Password: "guest"
      Messaging__RabbitMq__VirtualHost: "/"
      TransactionMessaging__RequestedQueue: "vault.transaction.transfer.requested"
      TransactionMessaging__ReservedQueue: "vault.transaction.transfer.funds-reserved"
      TransactionMessaging__CompletedQueue: "vault.transaction.transfer.completed"
      TransactionMessaging__FailedQueue: "vault.transaction.transfer.failed"
      Observability__Logging__Provider: "Serilog"
      Observability__Tracing__Enabled: "true"
      Observability__Metrics__Enabled: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      VAULT_OTEL_TRACE_SAMPLING_RATIO: "1.0"
    ports:
      - "8084:8080"

  reporting-db:
    image: mongo:8.0
    ports:
      - "27019:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - reporting-data:/data/db

  reporting-api:
    build:
      context: .
      dockerfile: src/services/reporting/Vault.Services.Reporting.Api/Dockerfile
    depends_on:
      reporting-db:
        condition: service_healthy
      identity-api:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      Authentication__Authority: "http://localhost:8080"
      Authentication__MetadataAddress: "http://identity-api:8080/.well-known/openid-configuration"
      Authentication__RequireHttpsMetadata: "false"
      Mongo__ConnectionString: "mongodb://reporting-db:27017"
      Mongo__DatabaseName: "vault-reporting"
      Mongo__ReportsCollectionName: "wallet_activity_reports"
      Messaging__Provider: "Kafka"
      Messaging__Kafka__BootstrapServers: "kafka:9092"
      ReportingMessaging__LedgerEventsDestination: "vault.ledger.events"
      ReportingMessaging__ConsumerGroupId: "vault-reporting-projection"
      Observability__Logging__Provider: "Serilog"
      Observability__Tracing__Enabled: "true"
      Observability__Metrics__Enabled: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      VAULT_OTEL_TRACE_SAMPLING_RATIO: "1.0"
    ports:
      - "8085:8080"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    depends_on:
      jaeger:
        condition: service_started
    volumes:
      - ./deploy/observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"

  prometheus:
    image: prom/prometheus:v2.53.0
    depends_on:
      otel-collector:
        condition: service_started
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.7.0
    command: ["--config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./deploy/observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.17.0
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    depends_on:
      loki:
        condition: service_started
    volumes:
      - ./deploy/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"

  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started
      loki:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - ./deploy/observability/grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  kafka-data:
  identity-data:
  customer-data:
  ledger-data:
  wallet-data:
  wallet-cache-data:
  rabbitmq-data:
  transaction-data:
  reporting-data:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
