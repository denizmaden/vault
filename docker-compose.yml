name: vault

services:
  identity-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_password123"
    ports:
      - "14333:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Your_strong_password123 -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - identity-data:/var/opt/mssql

  identity-api:
    build:
      context: .
      dockerfile: src/services/identity/Vault.Services.Identity.Api/Dockerfile
    depends_on:
      identity-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__IdentityDatabase: "Server=identity-db,1433;Database=VaultIdentity;User Id=sa;Password=Your_strong_password123;TrustServerCertificate=True"
      IdentityServer__SwaggerClientId: "vault-swagger"
      IdentityServer__SwaggerClientSecret: "vault-swagger-secret"
      IdentityServer__IssuerUri: "http://localhost:8080"
    ports:
      - "8080:8080"

volumes:
  identity-data:
